version: '3.8'

services:
  api:
    build: .
    container_name: examgenius-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./jamb_questions.db:/app/jamb_questions.db
      - ./JAMB:/app/JAMB
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  # Optional: Add nginx reverse proxy
  # nginx:
  #   image: nginx:alpine
  #   container_name: examgenius-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf
  #   depends_on:
  #     - api
  #   restart: unless-stopped

networks:
  default:
    name: examgenius-network
