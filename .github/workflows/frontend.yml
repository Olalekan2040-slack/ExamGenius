name: Deploy Frontend to EC2

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Frontend files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "frontend/*"
          target: "/tmp/frontend-deploy"
          strip_components: 1 # This prevents it from creating a 'frontend' folder inside the target

      - name: Move files and Set Permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Ensure the web directory exists
            sudo mkdir -p /var/www/html
            
            # Move files from temp to web root
            sudo cp -r /tmp/frontend-deploy/* /var/www/html/
            
            # Clean up temp files
            rm -rf /tmp/frontend-deploy
            
            # Set correct ownership for the web server (Nginx/Apache)
            sudo chown -R www-data:www-data /var/www/html
            sudo chmod -R 755 /var/www/html
