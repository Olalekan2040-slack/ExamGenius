name: Deploy Frontend to EC2

on:
  push:
    branches:
      - master  # Set this to your default branch
    paths:
      - 'frontend/**' # Only trigger when files in the frontend folder change

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # 1. Navigate to your app directory (create if it doesn't exist)
            sudo mkdir -p /var/www/html
            
            # 2. Navigate to a temp folder to pull the repo
            cd /tmp
            rm -rf my-repo-temp
            git clone https://github.com/${{ github.repository }}.git my-repo-temp
            
            # 3. Copy only the frontend folder contents to the web root
            sudo cp -r my-repo-temp/frontend/* /var/www/html/
            
            # 4. Cleanup
            rm -rf my-repo-temp
            
            # 5. Ensure correct permissions for the web server
            sudo chown -R www-data:www-data /var/www/html
            sudo chmod -R 755 /var/www/html
