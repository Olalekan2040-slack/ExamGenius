name: Deploy Frontend to EC2

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Frontend files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "frontend/*"
          target: "/tmp/frontend-deploy"
          strip_components: 1

      - name: Move files and Restart Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # 1. Ensure the web directory exists
            sudo mkdir -p /var/www/html
            
            # 2. Move files from temp to web root
            sudo cp -r /tmp/frontend-deploy/* /var/www/html/
            
            # 3. Clean up temp files
            rm -rf /tmp/frontend-deploy
            
            # 4. Set correct ownership
            sudo chown -R www-data:www-data /var/www/html
            sudo chmod -R 755 /var/www/html

            # 5. Check Nginx config and restart
            echo "Checking Nginx configuration..."
            sudo nginx -t && sudo systemctl restart nginx
            echo "Nginx restarted successfully."
