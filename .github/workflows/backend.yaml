name: Deploy Backend to EC2

on:
  push:
    branches: [ master ] # Changed from master to main
    paths:
      - "app/**"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/backend.yaml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.BACKENDSERVER }} >> ~/.ssh/known_hosts

      - name: Deploy Backend
        run: |
          # The -T flag prevents the "Pseudo-terminal will not be allocated" warning
          ssh -T -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd ~/examgenius
            
            # Make sure this matches your 'master' branch
            git pull origin master

            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt

            pm2 delete examgenius || true
            
            # Direct execution of uvicorn from the venv is more stable with PM2
            ./venv/bin/pm2 start ./venv/bin/uvicorn \
              --name examgenius \
              -- main:app --host 0.0.0.0 --port 8000
            
            pm2 save
          EOF
          EOF
