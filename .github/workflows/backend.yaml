name: Deploy Backend to EC2

on:
  push:
    branches: [ master ] # Changed from master to main
    paths:
      - "app/**"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/backend.yaml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Backend
        run: |
          # Added -i flag explicitly to ensure the correct key is used
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd ~/examgenius
            
            # Ensure you are pulling the correct branch on the server
            git pull origin main

            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -r requirements.txt

            # PM2 restart logic
            pm2 delete examgenius || true
            pm2 start ./venv/bin/uvicorn \
              --name examgenius \
              -- main:app --host 0.0.0.0 --port 8000
            
            pm2 save
          EOF
